<section id="top" class="bf-hero" aria-labelledby="bfTitle">
  <div class="bf-poster">
    <a class="bf-hero-visual bf-photo" href="?p=suit-baby-girl&amp;c=pink#top" aria-label="Переглянути рожевий костюм Baby Girl Oversized">
      <img src="/assets/suit-baby-girl-model-seated.webp" width="1024" height="1536"
           alt="Рожевий костюм Baby Girl Oversized на моделі" fetchpriority="high">
      <span class="bf-look-label"><span class="bf-look-plus" aria-hidden="true"></span>Костюм Baby Girl</span>
    </a>
    <div class="bf-hero-copy">
      <h1 id="bfTitle" class="bf-hero-title" lang="en"><span>Black</span> <span>Friday</span></h1>
      <dl class="bf-hero-offer" aria-label="Ціни Black Friday">
        <div><dt>Футболки</dt><dd>{{tee}} <small>₴</small></dd></div>
        <div><dt>Худі</dt><dd>{{hoodie}} <small>₴</small></dd></div>
        <div><dt>Кроп-топи</dt><dd>{{crop}} <small>₴</small></dd></div>
      </dl>
      <a class="bf-shop-link" href="#bestsellers">Обрати зі знижкою</a>
    </div>
  </div>
</section>
<script>
(function () {
  var photo = document.querySelector('.bf-hero-visual');
  photo.addEventListener('click', function (event) {
    if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    if (typeof window.__bgOpenProduct !== 'function') return;
    var product = new URL(photo.href).searchParams;
    event.preventDefault();
    window.__pmPreselectColor = product.get('c');
    window.__bgOpenProduct(product.get('p'));
  });
})();
</script>

</nav>
