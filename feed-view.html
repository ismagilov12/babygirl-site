<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>BabyGirl — товарный фид</title>
  <style>
    :root {
      --bg: #f4f0ed;
      --surface: #ffffff;
      --ink: #111111;
      --muted: #706b68;
      --line: #ded8d4;
      --accent: #ff4f9f;
      --accent-dark: #e62f83;
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 79, 159, .11), transparent 28rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; }

    .hero {
      padding: 22px clamp(18px, 4vw, 64px) 34px;
      color: #fff;
      background: #101010;
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      right: -120px;
      top: -190px;
      border-radius: 50%;
      background: var(--accent);
      filter: blur(3px);
      opacity: .9;
    }

    .topbar,
    .hero-content {
      width: min(1440px, 100%);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 950;
      letter-spacing: -.055em;
      text-transform: uppercase;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      color: rgba(255,255,255,.8);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #47e684;
      box-shadow: 0 0 0 5px rgba(71,230,132,.14);
    }

    .hero-content {
      padding-top: clamp(60px, 10vw, 118px);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 920px;
      margin: 0;
      font-size: clamp(42px, 8vw, 104px);
      line-height: .9;
      letter-spacing: -.075em;
      text-transform: uppercase;
    }

    .hero-copy {
      max-width: 620px;
      margin: 24px 0 0;
      color: rgba(255,255,255,.7);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.55;
    }

    main {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 28px clamp(14px, 4vw, 64px) 70px;
    }

    .tools {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 24px;
    }

    .search {
      width: 100%;
      min-height: 50px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,255,255,.82);
      font: inherit;
      outline: none;
      box-shadow: 0 8px 30px rgba(30,20,16,.04);
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(255,79,159,.12);
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.68);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter[aria-pressed="true"] {
      border-color: var(--ink);
      color: #fff;
      background: var(--ink);
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 0 2px 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .summary strong { color: var(--ink); }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(12px, 2vw, 24px);
    }

    .card {
      min-width: 0;
      border: 1px solid rgba(24,20,18,.08);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(38,23,18,.06);
      transition: transform .22s ease, box-shadow .22s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 45px rgba(38,23,18,.12);
    }

    .photo {
      display: block;
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #e7e1de;
    }

    .photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .5s cubic-bezier(.2,.7,.2,1);
    }

    .card:hover .photo img { transform: scale(1.025); }

    .photo.is-missing::after {
      content: "Нет фото";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1;
      padding: 7px 10px;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .body { padding: 16px; }

    .sku {
      margin-bottom: 7px;
      color: #9a9390;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .title {
      min-height: 2.5em;
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
      letter-spacing: -.025em;
    }

    .price-row {
      min-height: 30px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 15px;
    }

    .price {
      font-size: 18px;
      font-weight: 950;
      letter-spacing: -.03em;
    }

    .old-price {
      color: #a09a97;
      font-size: 13px;
      text-decoration: line-through;
    }

    .open {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      color: #fff;
      background: var(--ink);
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
      transition: background .18s ease;
    }

    .open:hover { background: var(--accent-dark); }

    .status,
    .empty {
      grid-column: 1 / -1;
      min-height: 320px;
      display: grid;
      place-items: center;
      padding: 36px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      background: rgba(255,255,255,.5);
    }

    .loader {
      width: 34px;
      height: 34px;
      margin: 0 auto 14px;
      border: 3px solid #ddd4d0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      padding: 0 clamp(18px, 4vw, 64px) 36px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    footer a { text-underline-offset: 3px; }

    @media (max-width: 980px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .hero { padding-top: 17px; }
      .hero-content { padding-top: 68px; }
      .tools { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary { align-items: flex-start; flex-direction: column; gap: 5px; }
    }

    @media (max-width: 430px) {
      main { padding-left: 10px; padding-right: 10px; }
      .grid { gap: 9px; }
      .card { border-radius: 14px; }
      .body { padding: 12px; }
      .title { font-size: 14px; }
      .price { font-size: 16px; }
      .sku { font-size: 9px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="topbar">
      <div class="brand">BabyGirl</div>
      <div class="live">Live feed</div>
    </div>
    <div class="hero-content">
      <p class="eyebrow">Meta Catalog Preview</p>
      <h1>Товары<br>с фото</h1>
      <p class="hero-copy">Визуальная версия товарного фида. Данные, цены и изображения загружаются напрямую из актуального каталога.</p>
    </div>
  </header>

  <main>
    <section class="tools" aria-label="Поиск и фильтры">
      <input class="search" id="search" type="search" placeholder="Найти товар по названию или ID…" autocomplete="off">
      <div class="filters" aria-label="Фильтр товаров">
        <button class="filter" type="button" data-filter="all" aria-pressed="true">Все товары</button>
        <button class="filter" type="button" data-filter="sale" aria-pressed="false">Со скидкой</button>
        <button class="filter" type="button" data-filter="stock" aria-pressed="false">В наличии</button>
      </div>
    </section>

    <div class="summary" aria-live="polite">
      <span id="count"><strong>—</strong> товаров</span>
      <span id="updated">Загрузка актуального фида…</span>
    </div>

    <section class="grid" id="grid" aria-live="polite">
      <div class="status">
        <div>
          <div class="loader" aria-hidden="true"></div>
          Загружаем товары и фотографии
        </div>
      </div>
    </section>
  </main>

  <footer>
    Данные обновляются автоматически · <a href="/feed.xml">Открыть исходный XML-фид</a>
  </footer>

  <script>
    (function () {
      "use strict";

      var NS = "http://base.google.com/ns/1.0";
      var state = { items: [], query: "", filter: "all", updated: "" };
      var grid = document.getElementById("grid");
      var count = document.getElementById("count");
      var updated = document.getElementById("updated");
      var search = document.getElementById("search");
      var filters = Array.prototype.slice.call(document.querySelectorAll(".filter"));

      function text(node, tag) {
        var found = node.getElementsByTagNameNS(NS, tag)[0] || node.getElementsByTagName("g:" + tag)[0];
        return found ? found.textContent.trim() : "";
      }

      function safeUrl(value) {
        try {
          var url = new URL(value, window.location.origin);
          return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
        } catch (_) {
          return "";
        }
      }

      function parse(xmlText) {
        var xml = new DOMParser().parseFromString(xmlText, "application/xml");
        if (xml.getElementsByTagName("parsererror").length) {
          throw new Error("Фид содержит некорректный XML");
        }

        var dateNode = xml.getElementsByTagName("lastBuildDate")[0];
        state.updated = dateNode ? dateNode.textContent.trim() : "";

        return Array.prototype.map.call(xml.getElementsByTagName("item"), function (node) {
          return {
            id: text(node, "id"),
            title: text(node, "title"),
            link: safeUrl(text(node, "link")),
            image: safeUrl(text(node, "image_link")),
            price: text(node, "price"),
            salePrice: text(node, "sale_price"),
            availability: text(node, "availability")
          };
        }).filter(function (item) {
          return item.title && item.image;
        });
      }

      function el(tag, className, value) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (value != null) node.textContent = value;
        return node;
      }

      function makeCard(item) {
        var card = el("article", "card");
        var photo = el("a", "photo");
        photo.href = item.link || "#";
        photo.target = "_blank";
        photo.rel = "noopener noreferrer";
        photo.setAttribute("aria-label", "Открыть товар " + item.title);

        var image = document.createElement("img");
        image.src = item.image;
        image.alt = item.title;
        image.loading = "lazy";
        image.decoding = "async";
        image.addEventListener("error", function () {
          image.remove();
          photo.classList.add("is-missing");
        });
        photo.appendChild(image);

        if (item.salePrice) {
          photo.appendChild(el("span", "badge", "Sale"));
        }

        var body = el("div", "body");
        body.appendChild(el("div", "sku", item.id));
        body.appendChild(el("h2", "title", item.title));

        var prices = el("div", "price-row");
        prices.appendChild(el("span", "price", item.salePrice || item.price));
        if (item.salePrice && item.price) prices.appendChild(el("span", "old-price", item.price));
        body.appendChild(prices);

        var open = el("a", "open", "Открыть товар");
        open.href = item.link || "#";
        open.target = "_blank";
        open.rel = "noopener noreferrer";
        body.appendChild(open);

        card.appendChild(photo);
        card.appendChild(body);
        return card;
      }

      function render() {
        var query = state.query.toLocaleLowerCase("ru");
        var shown = state.items.filter(function (item) {
          var matchesQuery = !query || (item.title + " " + item.id).toLocaleLowerCase("ru").indexOf(query) !== -1;
          var matchesFilter =
            state.filter === "all" ||
            (state.filter === "sale" && !!item.salePrice) ||
            (state.filter === "stock" && item.availability === "in stock");
          return matchesQuery && matchesFilter;
        });

        grid.replaceChildren();

        if (!shown.length) {
          grid.appendChild(el("div", "empty", "По вашему запросу товары не найдены."));
        } else {
          var fragment = document.createDocumentFragment();
          shown.forEach(function (item) { fragment.appendChild(makeCard(item)); });
          grid.appendChild(fragment);
        }

        count.innerHTML = "";
        var strong = el("strong", "", String(shown.length));
        count.appendChild(strong);
        count.appendChild(document.createTextNode(" из " + state.items.length + " товаров"));

        if (state.updated) {
          var parsed = new Date(state.updated);
          updated.textContent = isNaN(parsed.getTime())
            ? "Фид обновлён: " + state.updated
            : "Фид обновлён: " + parsed.toLocaleString("ru-RU");
        }
      }

      search.addEventListener("input", function () {
        state.query = search.value.trim();
        render();
      });

      filters.forEach(function (button) {
        button.addEventListener("click", function () {
          state.filter = button.dataset.filter;
          filters.forEach(function (item) {
            item.setAttribute("aria-pressed", item === button ? "true" : "false");
          });
          render();
        });
      });

      fetch("/feed.xml", { headers: { Accept: "application/xml" } })
        .then(function (response) {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.text();
        })
        .then(function (xmlText) {
          state.items = parse(xmlText);
          render();
        })
        .catch(function (error) {
          grid.replaceChildren();
          var message = el("div", "status");
          var inner = el("div");
          inner.appendChild(el("strong", "", "Не удалось загрузить товары"));
          inner.appendChild(document.createElement("br"));
          inner.appendChild(document.createTextNode("Обновите страницу через минуту. " + error.message));
          message.appendChild(inner);
          grid.appendChild(message);
          count.textContent = "Фид временно недоступен";
          updated.textContent = "";
        });
    }());
  </script>
</body>
</html>
